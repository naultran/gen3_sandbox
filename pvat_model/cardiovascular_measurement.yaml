$schema: "http://json-schema.org/draft-04/schema#"

id: "cardiovascular_measurement"
title: Cardiovascular measurements
type: object
namespace: https://toxdatacommons.com
category: data_file
program: '*'
project: '*'
description: >
  Weight measurements.
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state
  - file_state
  - error_type

required:
  - submitter_id
  - type


uniqueKeys:
  - [ id ]
  - [ project_id, submitter_id ]

links:
  - exclusive: false
    required: true
    subgroup:
    - name: subjects
      backref: cardiovascular_measurements
      label: data_from
      target_type: subject
      multiplicity: many_to_many
      required: false   
    - name: core_metadata_collections
      backref: weight_measurements
      label: data_from
      target_type: core_metadata_collection
      multiplicity: many_to_many
      required: false

properties:
