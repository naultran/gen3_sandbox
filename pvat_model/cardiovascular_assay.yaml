$schema: "http://json-schema.org/draft-04/schema#"

id: "cardiovascular_assay"
title: Cardiovascular assays
type: object
namespace: https://toxdatacommons.com
category: biospecimen
program: '*'
project: '*'
description: >
  description of cardiovascular_assay
additionalProperties: false
submittable: true
validators: null

systemProperties:
  - id
  - project_id
  - created_datetime
  - updated_datetime
  - state
  - file_state
  - error_type

required:
  - submitter_id
  - type


uniqueKeys:
  - [ id ]
  - [ project_id, submitter_id ]

links:
  - exclusive: false
    required: true
    subgroup:
    - name: subjects
      backref: cardiovascular_assays
      label: data_from
      target_type: subject
      multiplicity: many_to_many
      required: false   

properties:
  $ref: "_definitions.yaml#/data_file_properties"
  type:
    enum: [ "cardiovascular_assay" ]
  cardiovascular_endpoint:
    $ref: "_definitions.yaml#/cardiovascular_endpoint"
  instrument_model:
    $ref: "_definitions.yaml#/instrument_model"
  immobilization_method:
    $ref: "_definitions.yaml#/immobilization_method"
  subjects:
    $ref: "_definitions.yaml#/to_many"
  measurement_ZT:
    type: string
    description: "The Zeitgeber Time (ZT) at which a measurement is taken. This refers 
                  to the time relative to the light/dark cycle, where ZT 0 is the onset 
                  of the light phase and ZT 12 is the onset of the dark phase."
  measurement_date:
    type: string
    description: "The date on which the measurement or observation was made during the 
                  study or experiment."
  protocol:
    type: string
    description: "The standard procedure or set of instructions followed during 
                  the experiment or study. This may include specific steps, 
                  conditions, or methods used to collect and analyze data."
  protocol_doi:
    type: string
    description: "The DOI (Digital Object Identifier) associated with the protocol, 
                  providing a permanent link to the published or publicly available 
                  version of the experimental protocol."
  provenance: 
    type: string
    description: "template version" 
  state:
    $ref: "_definitions.yaml#/state"
  project_id:
    $ref: "_definitions.yaml#/project_id"
  created_datetime:
    $ref: "_definitions.yaml#/datetime"
  updated_datetime:
    $ref: "_definitions.yaml#/datetime"