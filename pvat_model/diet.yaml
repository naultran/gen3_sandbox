$schema: "http://json-schema.org/draft-04/schema#"

id: "diet"
title: diet
type: object
category: administrative
program: '*'
project: '*'
description: >
  description of diet.
additionalProperties: false
submittable: true
validators: null

systemProperties: 
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

required:
  - type
  - submitter_id
#  - provenance


uniqueKeys:
  - [id]
  - [  project_id, submitter_id ]

links:
  - name: housings
    backref: diets
    label: member_of
    target_type: housing
    multiplicity: one_to_many
    required: true

properties: 
  type:
    enum: ["diet"]
  id:
    $ref: "_definitions.yaml#/UUID"
    systemAlias: node_id
  submitter_id:
    type: string
  date:
    type: string
    description: "The data at which the standard or custom diet was provided."
  feed_catalog_number:
    type: string
    description: "The catalog number assigned by the vendor for the specific feed used in the study."
  housings:
    $ref: "_definitions.yaml#/to_many" 
  feed_description:
    type: string
    description: "A brief description of the feed used, including formulation, composition, and any special characteristics."
  feed_name:
    type: string
    description: "The specific name of the feed product used, as designated by the manufacturer or supplier."
  feed_vendor:
    type: string
    description: "The company or supplier that provided the feed used in the study."
  water_type:
    enum: 
      - Aquavive acidified (Innovive)
      - Aquavive chlorinated (Innovive)
      - Aquavive ultra-pure (Innovive)
      - MSU DI water
      - MSU Tap water
      - Not applicable
      - Missing
      - Not collected
      - Not provided
      - Restricted access
    description: "The type of water provided to the organism."
  feed_paradigm:
    $ref: "_definitions.yaml#/feed_paradigm" 
  provenance:
    type: string
    description: "template version"
  state:
    $ref: "_definitions.yaml#/state"
  project_id:
    $ref: "_definitions.yaml#/project_id"
  created_datetime:
    $ref: "_definitions.yaml#/datetime"
  updated_datetime:
    $ref: "_definitions.yaml#/datetime"