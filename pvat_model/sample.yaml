$schema: "http://json-schema.org/draft-04/schema#"

id: "sample"
title: sample
type: object
category: biospecimen
program: '*'
project: '*'
description: >
  A biological material collected from the subject for analysis. This 
  can include whole tissues, blood samples, urine, or other biospecimens. 
  Samples serve as the source for further processing, analysis, or 
  aliquot generation.
additionalProperties: false
submittable: true
validators: null

systemProperties: 
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

required:
  - type
  - submitter_id

#  - provenance


uniqueKeys:
  - [id]
  - [project_id, submitter_id]

links:
  - exclusive: false
    required: true
    subgroup:
    - name: subjects
      backref: samples
      label: member_of
      target_type: subject
      multiplicity: many_to_one
      required: false
    - name: cell_subjects
      backref: samples
      label: member_of
      target_type: cell_subject
      multiplicity: many_to_one
      required: false

properties: 
  type:
    enum: ["sample"]
  id:
    $ref: "_definitions.yaml#/UUID"
    systemAlias: node_id
  submitter_id:
    type: string
  subjects:
    $ref: "_definitions.yaml#/to_one"
  cell_subjects:
    $ref: "_definitions.yaml#/to_one"
  date:
    type: string
  biospecimen_anatomic_site:
    $ref: "_definitions.yaml#/biospecimen_anatomic_site"
  adipose_depot:
    description: "The specific anatomical location of adipose tissue collection. 
                  Adipose depots vary in their metabolic and physiological properties, 
                  influencing research on obesity, metabolism, and disease. 
                  This field specifies the precise depot from which the sample was obtained."
    enum:
      - Abdominal
      - Axillary
      - Bone marrow
      - Carotid
      - Cervical
      - Cranial
      - Dorsolumbular
      - Epicardial
      - Epididymal
      - Facial
      - Femoral
      - Gluteal
      - Gonadal
      - Inguinal
      - Intra-muscular
      - Mammary
      - Mediastinal
      - Mesenteric
      - Omental
      - Paravertebral
      - Pericardial
      - Perirenal
      - Peritoneal
      - Pulmonary
      - Retro-orbital
      - Retroperitoneal
      - Subscapular
      - Supraclavicular
      - Suprarenal
      - Suprascapular
      - Thoracic
      - Tricep
      - Upper-body
      - Uterine
      - Not applicable
      - Missing
      - Not collected
      - Not provided
      - Restricted access
  adipose_vascularization:
    description:
    enum:
      - Perivascular
      - Non-perivascular
  method_of_sample_procurement:
    $ref: "_definitions.yaml#/method_of_sample_procurement"
  preservation_method:
    type: string
  storage_vessel:
    type: string
  collection_protocol: 
    type: string
  provenance: 
    type: string
    description: "template version"
  state:
    $ref: "_definitions.yaml#/state"
  project_id:
    $ref: "_definitions.yaml#/project_id"
  created_datetime:
    $ref: "_definitions.yaml#/datetime"
  updated_datetime:
    $ref: "_definitions.yaml#/datetime"

    



